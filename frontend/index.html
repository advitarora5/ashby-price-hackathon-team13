<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%BRAND_NAME% · %BRAND_DESCRIPTOR%. Research use only." />
    <meta name="theme-color" content="#f6f8fa" />
    <title>%BRAND_NAME%</title>
    <style>
      /* Boot screen. It sits outside #root so React mounting underneath does not replace it;
         src/lib/boot.ts fades it out once the first data has loaded. */
      html, body, #root { height: 100%; margin: 0; background: #f6f8fa; }
      .boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f6f8fa;
        color: #5b6b7c; font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 420ms cubic-bezier(0.2, 0.7, 0.3, 1), visibility 0s linear 420ms; }
      .boot.is-leaving { opacity: 0; visibility: hidden; }
      .boot-inner { display: flex; flex-direction: column; align-items: center; transition: transform 420ms cubic-bezier(0.2, 0.7, 0.3, 1); }
      .boot.is-leaving .boot-inner { transform: scale(0.97); }
      .boot-mark { display: block; animation: boot-in 520ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
      .boot-arc { stroke-dasharray: 100; stroke-dashoffset: 100; animation: boot-draw 900ms cubic-bezier(0.5, 0, 0.2, 1) 120ms forwards; }
      .boot-dot, .boot-glow, .boot-pulse { transform-box: fill-box; transform-origin: center; }
      .boot-dot { opacity: 0; animation: boot-pop 360ms cubic-bezier(0.3, 1.5, 0.5, 1) 820ms forwards; }
      .boot-glow { opacity: 0; animation: boot-fade 400ms ease-out 900ms forwards; }
      .boot-pulse { opacity: 0; animation: boot-pulse 1.6s ease-out 1.1s infinite; }
      .boot-name { margin-top: 18px; color: #20364a; font-weight: 650; font-size: 19px; letter-spacing: -0.01em; animation: boot-rise 500ms cubic-bezier(0.2, 0.7, 0.3, 1) 200ms both; }
      .boot-descriptor { margin-top: 2px; font-size: 12.5px; animation: boot-rise 500ms cubic-bezier(0.2, 0.7, 0.3, 1) 280ms both; }
      .boot-bar { position: relative; width: 168px; height: 3px; margin-top: 26px; border-radius: 999px; background: #e3e9ef; overflow: hidden; animation: boot-fade 400ms ease-out 360ms both; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 38%; border-radius: inherit; background: linear-gradient(90deg, #416b8d, #2f9a95);
        animation: boot-slide 1.25s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      .boot.is-done .boot-bar::after { animation: none; width: 100%; transform: none; transition: width 260ms ease-out; }
      .boot-status { margin-top: 10px; min-height: 1.4em; font-size: 12px; animation: boot-fade 400ms ease-out 360ms both; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.88); } }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
      @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(4px); } }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(265%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot *, .boot *::after { animation-duration: 0.001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        .boot-pulse { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <div class="boot-inner">
        <svg class="boot-mark" width="64" height="64" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="boot-tile" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#4b7ba1" />
              <stop offset="1" stop-color="#2c4d6a" />
            </linearGradient>
            <radialGradient id="boot-glow">
              <stop offset="0" stop-color="#7fe0d6" stop-opacity=".6" />
              <stop offset="1" stop-color="#7fe0d6" stop-opacity="0" />
            </radialGradient>
          </defs>
          <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#boot-tile)" />
          <path class="boot-arc" pathLength="100" d="M21.6 9.9A8.6 8.6 0 1 0 21.6 22.1" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" />
          <circle class="boot-glow" cx="23.6" cy="16" r="5.4" fill="url(#boot-glow)" />
          <circle class="boot-pulse" cx="23.6" cy="16" r="2.8" fill="none" stroke="#7fe0d6" stroke-width=".8" />
          <circle class="boot-dot" cx="23.6" cy="16" r="2.8" fill="#7fe0d6" />
        </svg>
        <span class="boot-name">%BRAND_NAME%</span>
        <span class="boot-descriptor">%BRAND_DESCRIPTOR%</span>
        <span class="boot-bar" aria-hidden="true"></span>
        <span class="boot-status" id="boot-status">Loading cases…</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
